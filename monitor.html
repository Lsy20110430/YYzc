<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 服务器检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #1a1625 url("https://pic1.imgdb.cn/item/69622b91bec004ac7e59a4da.png") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            color: #eae6f2;
            padding: 30px 0;
            min-height: 100vh;
        }

        #mainContent {
            display: block;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .glass-block {
            background: rgba(30, 26, 42, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 2rem 1.8rem;
            border: 2px solid rgba(250, 204, 212, 0.45);
            box-shadow: 0 12px 28px rgba(255, 138, 174, 0.15);
            transition: all 0.2s ease;
        }

        .glass-block:hover {
            border-color: rgba(255, 138, 174, 0.7);
            box-shadow: 0 16px 32px rgba(255, 138, 174, 0.25);
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .back-btn {
            background: rgba(255, 138, 174, 0.2);
            border: 2px solid rgba(255, 138, 174, 0.5);
            border-radius: 40px;
            color: #ff8aae;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 138, 174, 0.35);
            transform: translateX(-3px);
        }

        .section-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ff8aae;
            margin-bottom: 1.2rem;
            padding-left: 0.8rem;
            border-left: 5px solid #ff8aae;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px dashed rgba(255,200,210,0.4);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .item-value {
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 600;
        }

        .normal { background: #2e7d64; color: #e0ffe8; }
        .redirect { background: #3b6e9e; color: #fff; }
        .client-err { background: #b9772e; color: #fff0d0; }
        .server-err { background: #b33b3b; color: #ffe0e0; }
        .loading { background: #6b5f7e; color: #f0e6ff; }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .cute-btn {
            background: linear-gradient(135deg, #ff8aae 0%, #c89eff 100%);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(255, 138, 174, 0.4);
            border: none;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        .cute-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e85d75, #a875ff);
            box-shadow: 0 8px 20px rgba(232, 93, 117, 0.6);
        }

        .cute-btn-outline {
            background: transparent;
            border: 2px solid #ff8aae;
            color: #ff8aae;
            box-shadow: none;
        }

        .cute-btn-outline:hover {
            background: rgba(255,138,174,0.2);
            color: white;
        }

        input {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,200,210,0.6);
            border-radius: 40px;
            padding: 0.7rem 1rem;
            color: white;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            transition: 0.2s;
            flex: 2;
            min-width: 150px;
        }

        input:focus {
            border-color: #ff8aae;
            background: rgba(30,20,45,0.7);
        }

        .log-box {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 0.8rem;
            font-size: 0.7rem;
            margin-top: 1rem;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
        }

        .log-box div {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,138,174,0.3);
            border-top-color: #ff8aae;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .tooltip-trigger {
            cursor: pointer;
            text-decoration: underline;
            color: #a89bb8;
            font-size: 0.7rem;
        }

        .tooltip-popup {
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 10px;
            margin-top: 8px;
            font-size: 0.7rem;
        }

        .hidden { display: none; }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 1rem;
            color: #8a7e9e;
        }

        @media (max-width: 640px) {
            .glass-block { padding: 1.5rem; }
            .section-title { font-size: 1.4rem; }
            #mainContent { padding: 0 12px; }
        }
    </style>
</head>
<body>

<div id="mainContent">
    <div class="glass-block">
        <div class="back-bar">
            <a href="home.html" class="back-btn">← 返回菜单</a>
            <span style="color:#cdc2e6; font-size:0.9rem;">📡 服务器检测</span>
        </div>

        <div class="section-title">📡 网站状态监控</div>

        <div class="flex-between">
            <span>监测目标：</span>
            <strong id="currentMonitorTarget" style="color:#ff8aae;">未设置</strong>
        </div>

        <div class="status-item">
            <span>可访问性</span>
            <span id="accessStatus" class="item-value loading">未检测</span>
        </div>
        <div class="status-item">
            <span>HTTP状态码</span>
            <span id="httpStatus" class="item-value loading">-</span>
        </div>
        <div class="status-item">
            <span>响应耗时</span>
            <span id="respTime" class="item-value loading">-</span>
        </div>
        <div class="status-item">
            <span>最后检测</span>
            <span id="lastCheckTime" class="item-value normal">-</span>
        </div>

        <div class="btn-group">
            <input type="text" id="targetUrlInput" placeholder="https:// 目标网址">
            <button class="cute-btn" id="setTargetBtn">设置并检测</button>
            <button class="cute-btn cute-btn-outline" id="refreshMonitorBtn">手动刷新</button>
        </div>

        <div class="log-box" id="monitorLog">
            <div>就绪，请设置目标开始监控~</div>
        </div>

        <div style="font-size:0.7rem; text-align:right; margin-top:8px;">
            <span class="tooltip-trigger" id="statusTooltipTrigger">♡ 状态码说明 ♡</span>
        </div>
        <div id="statusCodePopup" class="tooltip-popup hidden">
            <strong>2xx成功 · 3xx重定向 · 4xx客户端错 · 5xx服务端错</strong><br>
            200 OK · 301 永久重定向 · 404 未找到 · 500 服务器错误等
        </div>
    </div>

    <div class="footer">© 2026 韵殷官方 · 联系方式: ruinwisp@outlook.com</div>
</div>

<script>
    (function() {
        const isVerified = sessionStorage.getItem('yunyao_verified') === 'true';
        if (!isVerified) {
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('mainContent').style.display = 'block';
    })();

    // ========= 网站状态监控模块 =========
    let currentTarget = '';
    let autoRefreshTimer = null;
    const logBox = document.getElementById('monitorLog');

    function addMonitorLog(msg) {
        const p = document.createElement('div');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(p);
        logBox.scrollTop = logBox.scrollHeight;
        if(logBox.children.length > 30) logBox.removeChild(logBox.children[0]);
    }

    addMonitorLog('监控已就绪，请设置目标URL');

    async function checkWebsiteStatus() {
        if(!currentTarget) return;
        const accessSpan = document.getElementById('accessStatus');
        const statusSpan = document.getElementById('httpStatus');
        const timeSpan = document.getElementById('respTime');
        const lastSpan = document.getElementById('lastCheckTime');
        [accessSpan, statusSpan, timeSpan].forEach(el => {
            el.className = 'item-value loading';
            el.innerHTML = '<span class="loading-spinner"></span>检测中';
        });
        const start = Date.now();
        let code = null, ok = false, text = '';
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            const res = await fetch(currentTarget, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
            clearTimeout(timeout);
            code = res.status || 0;
            ok = (code >= 200 && code < 400) || code === 0;
            text = code ? `${code} ${res.statusText || ''}` : '跨域响应(200推测)';
        } catch(e) {
            code = -1;
            text = '请求失败/超时';
            ok = false;
        }
        const cost = Date.now() - start;
        const cls = code === -1 ? 'server-err' : (code>=200&&code<300?'normal':(code>=300&&code<400?'redirect':(code>=400&&code<500?'client-err':'server-err')));
        accessSpan.className = `item-value ${cls}`;
        accessSpan.textContent = ok ? '✅ 正常访问' : '❌ 无法访问';
        statusSpan.className = `item-value ${cls}`;
        statusSpan.textContent = text;
        timeSpan.className = `item-value ${cls}`;
        timeSpan.textContent = cost+'ms';
        lastSpan.className = 'item-value normal';
        lastSpan.textContent = new Date().toLocaleString();
        addMonitorLog(`${ok?'✅':'❌'} ${currentTarget} - ${text} (${cost}ms)`);
    }

    document.getElementById('setTargetBtn')?.addEventListener('click', () => {
        let raw = document.getElementById('targetUrlInput').value.trim();
        if(!raw) return alert('请输入URL');
        if(!raw.startsWith('http')) raw = 'https://' + raw;
        currentTarget = raw;
        document.getElementById('currentMonitorTarget').innerText = currentTarget;
        if(autoRefreshTimer) clearInterval(autoRefreshTimer);
        checkWebsiteStatus();
        autoRefreshTimer = setInterval(checkWebsiteStatus, 60000);
        addMonitorLog(`目标设置为 ${currentTarget}，自动刷新每60秒`);
    });

    document.getElementById('refreshMonitorBtn')?.addEventListener('click', () => {
        if(currentTarget) checkWebsiteStatus();
        else alert('未设置目标');
    });

    document.getElementById('statusTooltipTrigger')?.addEventListener('click', () => {
        document.getElementById('statusCodePopup').classList.toggle('hidden');
    });

    window.addEventListener('beforeunload', () => {
        if(autoRefreshTimer) clearInterval(autoRefreshTimer);
    });
</script>

</body>
</html>
