<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 服务器检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("https://picui.ogmua.cn/s1/2026/07/31/6a6c81f424ff0.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            padding: 30px 0;
            min-height: 100vh;
        }

        #mainContent {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .glass-block {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 48px;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }

        .glass-block:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(255, 255, 255, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #000000;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.10);
            color: #000000;
            transform: translateX(-3px);
        }

        .section-title {
            color: rgba(255, 255, 255, 0.90);
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            padding-left: 0.8rem;
            border-left: 2px solid rgba(255, 255, 255, 0.12);
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.02);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.04);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-item span:first-child {
            color: #000000;
        }

        .item-value {
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            font-weight: 300;
            font-size: 0.9rem;
        }

        .normal { background: rgba(255, 255, 255, 0.06); color: #000000; }
        .redirect { background: rgba(255, 255, 255, 0.04); color: #000000; }
        .client-err { background: rgba(255, 255, 255, 0.03); color: #000000; }
        .server-err { background: rgba(255, 255, 255, 0.02); color: #000000; }
        .loading { background: rgba(255, 255, 255, 0.02); color: rgba(0,0,0,0.30); }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .cute-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #000000;
            padding: 0.7rem 1.5rem;
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        .cute-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.10);
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .cute-btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #000000;
            box-shadow: none;
        }

        .cute-btn-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            color: #000000;
        }

        input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            color: #000000;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            font-weight: 300;
            width: 100%;
            outline: none;
            transition: 0.3s;
            flex: 2;
            min-width: 150px;
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.20);
            font-weight: 200;
        }

        .log-box {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            color: #000000;
            padding: 0.8rem;
            font-size: 0.65rem;
            font-weight: 200;
            margin-top: 1rem;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
        }

        .log-box div {
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.02);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .tooltip-trigger {
            color: #000000;
            font-size: 0.65rem;
            font-weight: 200;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s;
        }

        .tooltip-trigger:hover {
            color: #000000;
        }

        .tooltip-popup {
            background: rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 10px;
            margin-top: 8px;
            font-size: 0.65rem;
            font-weight: 200;
        }

        .tooltip-popup strong {
            color: #000000;
            font-weight: 300;
        }

        .tooltip-popup span {
            color: #000000;
        }

        .hidden { display: none; }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .glass-block { padding: 1.5rem; }
            .section-title { font-size: 1.3rem; }
            #mainContent { padding: 0 12px; }
        }
    </style>
</head>
<body>

<div id="mainContent">
    <div class="glass-block">
        <div class="back-bar">
            <a href="home.html" class="back-btn">← 返回菜单</a>
            <span style="color:#000000; font-size:0.9rem;">📡 服务器检测</span>
        </div>

        <div class="section-title">📡 网站状态监控</div>

        <div class="flex-between">
            <span style="color:#000000;">监测目标：</span>
            <strong id="currentMonitorTarget" style="color:#000000; font-weight:300;">未设置</strong>
        </div>

        <div class="status-item">
            <span>可访问性</span>
            <span id="accessStatus" class="item-value loading">未检测</span>
        </div>
        <div class="status-item">
            <span>HTTP状态码</span>
            <span id="httpStatus" class="item-value loading">-</span>
        </div>
        <div class="status-item">
            <span>响应耗时</span>
            <span id="respTime" class="item-value loading">-</span>
        </div>
        <div class="status-item">
            <span>最后检测</span>
            <span id="lastCheckTime" class="item-value normal">-</span>
        </div>

        <div class="btn-group">
            <input type="text" id="targetUrlInput" placeholder="https:// 目标网址">
            <button class="cute-btn" id="setTargetBtn">设置并检测</button>
            <button class="cute-btn cute-btn-outline" id="refreshMonitorBtn">手动刷新</button>
        </div>

        <div class="log-box" id="monitorLog">
            <div>就绪，请设置目标开始监控~</div>
        </div>

        <div style="font-size:0.65rem; text-align:right; margin-top:8px;">
            <span class="tooltip-trigger" id="statusTooltipTrigger">♡ 状态码说明 ♡</span>
        </div>
        <div id="statusCodePopup" class="tooltip-popup hidden">
            <strong>2xx成功 · 3xx重定向 · 4xx客户端错 · 5xx服务端错</strong><br>
            <span>200 OK · 301 永久重定向 · 404 未找到 · 500 服务器错误等</span>
        </div>
    </div>

    <div class="footer">© 2026 韵殷官方 · 联系方式: ruinwisp@outlook.com</div>
</div>

<script>
    (function() {
        const VERIFY_KEY = 'yunyao_verified';
        const TIME_KEY = 'yunyao_verify_time';
        const EXPIRE_HOURS = 24;
        const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

        function isVerifiedValid() {
            const verified = localStorage.getItem(VERIFY_KEY) === 'true';
            const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
            const notExpired = (Date.now() - time) < EXPIRE_MS;
            return verified && notExpired;
        }

        if (!isVerifiedValid()) {
            if (localStorage.getItem(VERIFY_KEY) === 'true') {
                localStorage.removeItem(VERIFY_KEY);
                localStorage.removeItem(TIME_KEY);
            }
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('mainContent').style.display = 'block';
    })();

    let currentTarget = '';
    let autoRefreshTimer = null;
    const logBox = document.getElementById('monitorLog');

    function addMonitorLog(msg) {
        const p = document.createElement('div');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(p);
        logBox.scrollTop = logBox.scrollHeight;
        if(logBox.children.length > 30) logBox.removeChild(logBox.children[0]);
    }

    addMonitorLog('监控已就绪，请设置目标URL');

    async function checkWebsiteStatus() {
        if(!currentTarget) return;
        const accessSpan = document.getElementById('accessStatus');
        const statusSpan = document.getElementById('httpStatus');
        const timeSpan = document.getElementById('respTime');
        const lastSpan = document.getElementById('lastCheckTime');
        [accessSpan, statusSpan, timeSpan].forEach(el => {
            el.className = 'item-value loading';
            el.innerHTML = '<span class="loading-spinner"></span>检测中';
        });
        const start = Date.now();
        let code = null, ok = false, text = '';
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            const res = await fetch(currentTarget, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
            clearTimeout(timeout);
            code = res.status || 0;
            ok = (code >= 200 && code < 400) || code === 0;
            text = code ? `${code} ${res.statusText || ''}` : '跨域响应(200推测)';
        } catch(e) {
            code = -1;
            text = '请求失败/超时';
            ok = false;
        }
        const cost = Date.now() - start;
        const cls = code === -1 ? 'server-err' : (code>=200&&code<300?'normal':(code>=300&&code<400?'redirect':(code>=400&&code<500?'client-err':'server-err')));
        accessSpan.className = `item-value ${cls}`;
        accessSpan.textContent = ok ? '✅ 正常访问' : '❌ 无法访问';
        statusSpan.className = `item-value ${cls}`;
        statusSpan.textContent = text;
        timeSpan.className = `item-value ${cls}`;
        timeSpan.textContent = cost+'ms';
        lastSpan.className = 'item-value normal';
        lastSpan.textContent = new Date().toLocaleString();
        addMonitorLog(`${ok?'✅':'❌'} ${currentTarget} - ${text} (${cost}ms)`);
    }

    document.getElementById('setTargetBtn')?.addEventListener('click', () => {
        let raw = document.getElementById('targetUrlInput').value.trim();
        if(!raw) return alert('请输入URL');
        if(!raw.startsWith('http')) raw = 'https://' + raw;
        currentTarget = raw;
        document.getElementById('currentMonitorTarget').innerText = currentTarget;
        if(autoRefreshTimer) clearInterval(autoRefreshTimer);
        checkWebsiteStatus();
        autoRefreshTimer = setInterval(checkWebsiteStatus, 60000);
        addMonitorLog(`目标设置为 ${currentTarget}，自动刷新每60秒`);
    });

    document.getElementById('refreshMonitorBtn')?.addEventListener('click', () => {
        if(currentTarget) checkWebsiteStatus();
        else alert('未设置目标');
    });

    document.getElementById('statusTooltipTrigger')?.addEventListener('click', () => {
        document.getElementById('statusCodePopup').classList.toggle('hidden');
    });

    window.addEventListener('beforeunload', () => {
        if(autoRefreshTimer) clearInterval(autoRefreshTimer);
    });
</script>

</body>
</html>
