<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 功能菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("https://picui.ogmua.cn/s1/2026/07/31/6a6c81f424ff0.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #mainContent {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        /* ===== 大框：高透明度玻璃感（无模糊） ===== */
        .menu-container {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 56px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            text-align: center;
            transition: all 0.4s ease;
        }

        .menu-container:hover {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .menu-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 2.2rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.03);
        }

        .menu-sub {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 1.2rem;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 60px;
            color: #000000;
            display: block;
            width: 100%;
            padding: 1rem 0;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.28);
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.40);
        }

        .menu-btn .icon {
            margin-right: 10px;
            font-size: 1.3rem;
            opacity: 0.7;
        }

        .menu-btn .desc {
            color: #000000;
            display: block;
            font-size: 0.65rem;
            font-weight: 200;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem;
        }

        .footer a {
            color: #000000;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #000000;
        }
    </style>
</head>
<body>

<div id="mainContent">
    <div class="menu-container">
        <div class="menu-title">🌸 韵殷功能菜单</div>
        <div class="menu-sub">安全 · 公益 · 合规传播</div>

        <a href="info.html" class="menu-btn">
            <span class="icon">📋</span> 官网信息
            <span class="desc">了解上传费用与存储规则</span>
        </a>

        <a href="monitor.html" class="menu-btn">
            <span class="icon">📡</span> 服务器检测
            <span class="desc">实时监控网站可用性</span>
        </a>

        <a href="files.html" class="menu-btn">
            <span class="icon">📂</span> 文件分享
            <span class="desc">浏览所有公益分享文件</span>
        </a>

        <div class="footer">
            © 2026 韵殷官方 · 联系方式: <a href="mailto:ruinwisp@outlook.com">ruinwisp@outlook.com</a>
        </div>
    </div>
</div>

<script>
    (function() {
        const VERIFY_KEY = 'yunyao_verified';
        const TIME_KEY = 'yunyao_verify_time';
        const EXPIRE_HOURS = 24;
        const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

        function isVerifiedValid() {
            const verified = localStorage.getItem(VERIFY_KEY) === 'true';
            const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
            const notExpired = (Date.now() - time) < EXPIRE_MS;
            return verified && notExpired;
        }

        if (!isVerifiedValid()) {
            if (localStorage.getItem(VERIFY_KEY) === 'true') {
                localStorage.removeItem(VERIFY_KEY);
                localStorage.removeItem(TIME_KEY);
            }
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('mainContent').style.display = 'block';
    })();
</script>

</body>
</html>
