<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 功能菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #1a1625 url("https://pic1.imgdb.cn/item/69622b91bec004ac7e59a4da.png") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            color: #eae6f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #mainContent {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        .menu-container {
            width: 100%;
            background: rgba(30, 26, 42, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2.5rem 2rem;
            border: 2px solid rgba(250, 204, 212, 0.45);
            box-shadow: 0 12px 28px rgba(255, 138, 174, 0.15);
            text-align: center;
        }

        .menu-container:hover {
            border-color: rgba(255, 138, 174, 0.7);
            box-shadow: 0 16px 32px rgba(255, 138, 174, 0.25);
        }

        .menu-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ff8aae;
            text-shadow: 0 2px 8px rgba(255, 138, 174, 0.3);
            margin-bottom: 0.5rem;
        }

        .menu-sub {
            color: #cdc2e6;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,200,210,0.2);
            padding-bottom: 1.2rem;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 1rem 0;
            margin-bottom: 0.8rem;
            background: rgba(255, 138, 174, 0.15);
            border: 2px solid rgba(255, 138, 174, 0.4);
            border-radius: 60px;
            color: #eae6f2;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .menu-btn:hover {
            background: rgba(255, 138, 174, 0.30);
            border-color: #ff8aae;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 138, 174, 0.25);
        }

        .menu-btn:active {
            transform: translateY(1px);
        }

        .menu-btn .icon {
            margin-right: 10px;
            font-size: 1.3rem;
        }

        .menu-btn .desc {
            display: block;
            font-size: 0.7rem;
            font-weight: 400;
            color: #a89bb8;
            margin-top: 2px;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: #8a7e9e;
            border-top: 1px solid rgba(255,200,210,0.15);
            padding-top: 1rem;
        }

        .footer a {
            color: #ff8aae;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div id="mainContent">
    <div class="menu-container">
        <div class="menu-title">🌸 韵殷功能菜单</div>
        <div class="menu-sub">安全 · 公益 · 合规传播</div>

        <a href="info.html" class="menu-btn">
            <span class="icon">📋</span> 官网信息
            <span class="desc">了解上传费用与存储规则</span>
        </a>

        <a href="monitor.html" class="menu-btn">
            <span class="icon">📡</span> 服务器检测
            <span class="desc">实时监控网站可用性</span>
        </a>

        <a href="files.html" class="menu-btn">
            <span class="icon">📂</span> 文件分享
            <span class="desc">浏览所有公益分享文件</span>
        </a>

        <div class="footer">
            © 2026 韵殷官方 · 联系方式: <a href="mailto:ruinwisp@outlook.com">ruinwisp@outlook.com</a>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== 验证状态管理 =====
        const VERIFY_KEY = 'yunyao_verified';
        const TIME_KEY = 'yunyao_verify_time';
        const EXPIRE_HOURS = 24;
        const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

        function isVerifiedValid() {
            const verified = localStorage.getItem(VERIFY_KEY) === 'true';
            const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
            const notExpired = (Date.now() - time) < EXPIRE_MS;
            return verified && notExpired;
        }

        if (!isVerifiedValid()) {
            if (localStorage.getItem(VERIFY_KEY) === 'true') {
                localStorage.removeItem(VERIFY_KEY);
                localStorage.removeItem(TIME_KEY);
            }
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('mainContent').style.display = 'block';
    })();
</script>

</body>
</html>
