<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 功能菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("https://picui.ogmua.cn/s1/2026/07/31/6a6c81f424ff0.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #mainContent {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        .menu-container {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 56px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            text-align: center;
            transition: all 0.4s ease;
        }

        .menu-container:hover {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .menu-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 2.2rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.03);
        }

        .menu-sub {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 1.2rem;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 60px;
            color: #000000;
            display: block;
            width: 100%;
            padding: 1rem 0;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.22);
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .menu-btn .icon {
            margin-right: 10px;
            font-size: 1.3rem;
            opacity: 0.7;
        }

        .menu-btn .desc {
            color: #000000;
            display: block;
            font-size: 0.65rem;
            font-weight: 200;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* ===== 赞助按钮特殊样式 ===== */
        .menu-btn.sponsor {
            background: rgba(255, 200, 50, 0.15);
            border-color: rgba(255, 200, 50, 0.30);
            color: #8a6d00;
        }

        .menu-btn.sponsor:hover {
            background: rgba(255, 200, 50, 0.25);
            border-color: rgba(255, 200, 50, 0.40);
            color: #6b5500;
            box-shadow: 0 8px 30px rgba(255, 200, 50, 0.10);
        }

        .menu-btn.sponsor .icon {
            opacity: 1;
        }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem;
        }

        .footer a {
            color: #000000;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #000000;
        }

        /* ===== 磨砂弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border-radius: 40px;
            padding: 2.2rem 2rem;
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(255, 255, 255, 0.10);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 1rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        }

        .modal-title .icon {
            margin-right: 8px;
        }

        .modal-body {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.8;
            text-align: left;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 1rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal-body strong {
            font-weight: 500;
        }

        .modal-body .highlight {
            color: #ff8a50;
            font-weight: 400;
        }

        .modal-close-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.12);
            color: #000000;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.02);
        }

        /* ===== 弹窗显示控制 ===== */
        .modal-overlay.hidden {
            display: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .modal-box { padding: 1.5rem 1.2rem; }
            .modal-title { font-size: 1.3rem; }
            .modal-body { font-size: 0.8rem; padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body>

<!-- ===== 公告弹窗 ===== -->
<div id="announcementModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title"><span class="icon">📢</span> 公告</div>
        <div class="modal-body">
            <strong>欢迎大家使用韵殷 · 公益文件分享</strong>，感谢大家的支持。<br><br>
            纯公益开设，大家可以赞助一下，让韵殷团队的更新动力更高。<br><br>
            📱 <strong>QQ群：</strong>454493903<br>
            📢 <strong>Q频道：</strong>pd75072875<br>
            📧 <strong>邮箱：</strong>ruinwisp@outlook.com
        </div>
        <button class="modal-close-btn" id="closeModalBtn">我知道了</button>
    </div>
</div>

<!-- ===== 主内容 ===== -->
<div id="mainContent">
    <div class="menu-container">
        <div class="menu-title">🌸 韵殷功能菜单</div>
        <div class="menu-sub">安全 · 公益 · 合规传播</div>

        <a href="info.html" class="menu-btn">
            <span class="icon">📋</span> 官网信息
            <span class="desc">了解上传费用与存储规则</span>
        </a>

        <a href="monitor.html" class="menu-btn">
            <span class="icon">📡</span> 服务器检测
            <span class="desc">实时监控网站可用性</span>
        </a>

        <a href="files.html" class="menu-btn">
            <span class="icon">📂</span> 文件分享
            <span class="desc">浏览所有公益分享文件</span>
        </a>

        <!-- ===== 赞助我们按钮 ===== -->
        <a href="sponsor.html" class="menu-btn sponsor">
            <span class="icon">❤️</span> 赞助我们
            <span class="desc">您的支持是我们最大的动力</span>
        </a>

        <div class="footer">
            © 2026 韵殷官方 · 联系方式: <a href="mailto:ruinwisp@outlook.com">ruinwisp@outlook.com</a>
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== 人机验证检查 =====
        const VERIFY_KEY = 'yunyao_verified';
        const TIME_KEY = 'yunyao_verify_time';
        const EXPIRE_HOURS = 24;
        const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

        function isVerifiedValid() {
            const verified = localStorage.getItem(VERIFY_KEY) === 'true';
            const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
            const notExpired = (Date.now() - time) < EXPIRE_MS;
            return verified && notExpired;
        }

        if (!isVerifiedValid()) {
            if (localStorage.getItem(VERIFY_KEY) === 'true') {
                localStorage.removeItem(VERIFY_KEY);
                localStorage.removeItem(TIME_KEY);
            }
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('mainContent').style.display = 'block';

        // ===== 公告弹窗控制 =====
        const modal = document.getElementById('announcementModal');
        const closeBtn = document.getElementById('closeModalBtn');

        // 检查是否已经显示过弹窗（用 sessionStorage 记录，仅本次会话有效）
        const hasShown = sessionStorage.getItem('announcement_shown');

        if (hasShown) {
            modal.classList.add('hidden');
        } else {
            modal.classList.remove('hidden');
        }

        closeBtn.addEventListener('click', function() {
            modal.classList.add('hidden');
            sessionStorage.setItem('announcement_shown', 'true');
        });

        // 点击遮罩也可关闭
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.add('hidden');
                sessionStorage.setItem('announcement_shown', 'true');
            }
        });
    })();
</script>

</body>
</html>
