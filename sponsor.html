<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 赞助我们</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("../img/bz.jpg") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sponsor-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 48px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            text-align: center;
            transition: all 0.4s ease;
        }

        .sponsor-container:hover {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .sponsor-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 2rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.03);
        }

        .sponsor-sub {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 1rem;
        }

        .sponsor-image {
            width: 100%;
            border-radius: 24px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .sponsor-image img {
            width: 100%;
            height: auto;
            border-radius: 24px;
            display: block;
        }

        .back-btn {
            display: inline-block;
            padding: 0.7rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 60px;
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem;
        }

        /* ===== 磨砂弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border-radius: 40px;
            padding: 2.2rem 2rem;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(255, 255, 255, 0.10);
            animation: slideUp 0.4s ease;
            text-align: center;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-icon {
            font-size: 3.2rem;
            margin-bottom: 0.3rem;
        }

        .modal-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.5rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        }

        .modal-body {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.9;
            text-align: center;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 1rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal-body .highlight {
            color: #ff8a50;
            font-weight: 400;
        }

        .modal-body .highlight-gold {
            color: #b8860b;
            font-weight: 400;
        }

        .modal-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin: 0.6rem 0;
        }

        .modal-close-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.12);
            color: #000000;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.02);
        }

        .modal-overlay.hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .sponsor-container { padding: 1.5rem; }
            .sponsor-title { font-size: 1.6rem; }
            .modal-box { padding: 1.5rem 1.2rem; }
            .modal-title { font-size: 1.3rem; }
            .modal-body { font-size: 0.8rem; padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body>

<!-- ===== 感谢赞助弹窗（每次进入都弹出） ===== -->
<div id="thankModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">🌸</div>
        <div class="modal-title">一份心意，万分感激</div>
        <div class="modal-body">
            <p>
                无论您是否赞助，<br>
                您的每一次访问、每一次点击、每一份关注，<br>
                都是对我们 <span class="highlight">最大的鼓励</span>。
            </p>
            <hr class="modal-divider">
            <p>
                如果您选择了赞助，<br>
                请相信——<br>
                这份善意不会辜负。<br>
                <span class="highlight-gold">每一分钱都会变成光</span>，<br>
                照亮韵殷前行的路，也温暖需要帮助的人。
            </p>
            <hr class="modal-divider">
            <p style="font-size:0.85rem; color:rgba(0,0,0,0.45);">
                韵殷 · 因你而存在
            </p>
        </div>
        <button class="modal-close-btn" id="closeThankBtn">❤️ 谢谢</button>
    </div>
</div>

<!-- ===== 主内容 ===== -->
<div class="sponsor-container">
    <div class="sponsor-title">❤️ 赞助我们</div>
    <div class="sponsor-sub">您的支持是我们最大的动力</div>

    <div class="sponsor-image">
        <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYlBhqcvdBsQkG6MdoIH63z8Bipz2tVgACjSwAAniTmFcqBP7Vm4ZQQz0E.png" alt="赞助我们" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<p style=\'color:#000000;padding:40px 0;\'>⚠️ 图片加载失败，请稍后重试</p>'">
    </div>

    <a href="home.html" class="back-btn">← 返回菜单</a>

    <div class="footer">© 2026 韵殷官方 · 感谢您的支持</div>
</div>

<script>
    (function() {
        // ===== 感谢弹窗（每次进入都弹出，无次数限制） =====
        const thankModal = document.getElementById('thankModal');
        const closeBtn = document.getElementById('closeThankBtn');

        // 页面加载时自动显示弹窗
        thankModal.classList.remove('hidden');

        closeBtn.addEventListener('click', function() {
            thankModal.classList.add('hidden');
        });

        // 点击遮罩也可关闭
        thankModal.addEventListener('click', function(e) {
            if (e.target === thankModal) {
                thankModal.classList.add('hidden');
            }
        });
    })();
</script>

</body>
</html>
