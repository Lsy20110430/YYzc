<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 赞助我们</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("https://picui.ogmua.cn/s1/2026/07/31/6a6c81f424ff0.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sponsor-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 48px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            text-align: center;
            transition: all 0.4s ease;
        }

        .sponsor-container:hover {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .sponsor-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 2rem;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.03);
        }

        .sponsor-sub {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 1rem;
        }

        .sponsor-image {
            width: 100%;
            border-radius: 24px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .sponsor-image img {
            width: 100%;
            height: auto;
            border-radius: 24px;
            display: block;
        }

        .back-btn {
            display: inline-block;
            padding: 0.7rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 60px;
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem;
        }

        @media (max-width: 480px) {
            .sponsor-container { padding: 1.5rem; }
            .sponsor-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="sponsor-container">
    <div class="sponsor-title">❤️ 赞助我们</div>
    <div class="sponsor-sub">您的支持是我们最大的动力</div>

    <!-- ===== 赞助图片 ===== -->
    <div class="sponsor-image">
        <img src="https://picui.ogmua.cn/s1/2026/07/31/6a6c9d1c8c4c1.webp" alt="赞助我们" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<p style=\'color:#000000;padding:40px 0;\'>⚠️ 图片加载失败，请稍后重试</p>'">
    </div>

    <a href="home.html" class="back-btn">← 返回菜单</a>

    <div class="footer">© 2026 韵殷官方 · 感谢您的支持</div>
</div>

<!-- ===== 此页面无需人机验证，直接访问 ===== -->

</body>
</html>
