<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>韵殷 · 安全入口</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #e8e6ed url("https://picui.ogmua.cn/s1/2026/07/31/6a6c81f424ff0.webp") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: saturate(150%);
      -webkit-backdrop-filter: saturate(150%);
      border-radius: 56px;
      box-shadow: 
        0 40px 80px -30px rgba(0, 0, 0, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 1.0),
        inset 0 -1px 0 rgba(255, 255, 255, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.18);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2.2rem;
      transition: all 0.4s ease;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.32);
      box-shadow: 
        0 50px 100px -30px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 1.0),
        inset 0 -1px 0 rgba(255, 255, 255, 0.40),
        0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    h1 {
      color: rgba(255, 255, 255, 0.95);
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.05);
    }

    .subhead {
      color: #000000;
      font-size: 0.95rem;
      margin-bottom: 2.2rem;
      border-left: 2px solid rgba(0, 0, 0, 0.15);
      padding-left: 0.75rem;
      font-weight: 300;
      text-align: left;
    }

    .captcha-section .captcha-sub {
      color: #000000;
      font-size: 0.85rem;
      font-weight: 300;
      margin-bottom: 1.5rem;
      letter-spacing: 0.3px;
    }

    .captcha-track {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 60px;
      height: 48px;
      position: relative;
      width: 100%;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      cursor: grab;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .captcha-track:active {
      cursor: grabbing;
    }

    .captcha-track .captcha-bg {
      background: rgba(255, 255, 255, 0.20);
      border-radius: 60px;
      height: 100%;
      left: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      transition: width 0.05s linear;
      width: 0%;
      box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.20);
    }

    .captcha-track .captcha-thumb {
      background: rgba(255, 255, 255, 0.80);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 50%;
      height: 44px;
      left: 0;
      pointer-events: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: left 0.05s linear;
      width: 44px;
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .captcha-track .captcha-thumb svg {
      stroke: rgba(0, 0, 0, 0.4);
    }

    .captcha-status {
      color: #000000;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-top: 1rem;
      min-height: 1.6rem;
      text-align: center;
    }

    .captcha-status.success {
      color: #000000;
    }

    .captcha-status.error {
      color: #cc2233;
    }

    .captcha-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.2rem;
    }

    .captcha-actions .btn-captcha-confirm {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #000000;
      backdrop-filter: blur(4px);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.02),
        inset 0 1px 0 rgba(255, 255, 255, 0.30);
      flex: 1;
      border: none;
      padding: 0.7rem;
      border-radius: 40px;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .captcha-actions .btn-captcha-confirm:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
      color: #000000;
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.40);
    }

    .captcha-actions .btn-captcha-confirm:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .captcha-actions .btn-captcha-cancel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #000000;
      backdrop-filter: blur(4px);
      flex: 1;
      border: none;
      padding: 0.7rem;
      border-radius: 40px;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .captcha-actions .btn-captcha-cancel:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #000000;
    }

    .message-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 40px;
      color: #000000;
      backdrop-filter: blur(4px);
      margin: 1.2rem 0 0.5rem;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      font-weight: 300;
      text-align: center;
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .message-box.success {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.16);
      color: #000000;
    }

    .message-box.error {
      background: rgba(255, 200, 200, 0.06);
      border-color: rgba(255, 200, 200, 0.10);
      color: #cc2233;
    }

    .hidden {
      display: none !important;
    }

    /* ===== 用户协议弹窗 ===== */
    #agreementOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.50);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
      flex-direction: column;
    }

    #agreementOverlay.hidden {
      display: none;
    }

    .agreement-box {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border-radius: 48px;
      padding: 2.2rem 2rem;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 40px 80px -20px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 0 rgba(255, 255, 255, 0.10);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .agreement-title {
      color: rgba(255, 255, 255, 0.95);
      font-size: 1.5rem;
      font-weight: 200;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 1rem;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    }

    .agreement-body {
      color: #000000;
      font-size: 0.9rem;
      font-weight: 300;
      line-height: 1.9;
      text-align: left;
      margin-bottom: 1.2rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 1rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .agreement-body p {
      margin-bottom: 0.6rem;
    }

    .agreement-body p:last-child {
      margin-bottom: 0;
    }

    .agreement-body .link {
      color: #4a9eff;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 400;
      transition: color 0.2s;
    }

    .agreement-body .link:hover {
      color: #6ab4ff;
    }

    .agreement-divider {
      border: none;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      margin: 0.6rem 0;
    }

    .agreement-footer {
      text-align: center;
      color: rgba(0, 0, 0, 0.35);
      font-size: 0.85rem;
      font-weight: 300;
      margin-bottom: 1rem;
    }

    .agreement-actions {
      display: flex;
      gap: 0.8rem;
    }

    .agreement-actions .btn-agree {
      flex: 2;
      padding: 0.8rem;
      border: none;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(4px);
    }

    .agreement-actions .btn-agree:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.02);
    }

    .agreement-actions .btn-disagree {
      flex: 1;
      padding: 0.8rem;
      border: none;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.40);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
    }

    .agreement-actions .btn-disagree:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.60);
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.9rem; }
      .agreement-box { padding: 1.5rem 1.2rem; }
      .agreement-title { font-size: 1.3rem; }
      .agreement-body { font-size: 0.8rem; padding: 0.8rem 1rem; }
      .agreement-actions { flex-direction: column-reverse; gap: 0.5rem; }
      .agreement-actions .btn-agree { padding: 0.7rem; }
      .agreement-actions .btn-disagree { padding: 0.6rem; }
    }
  </style>
</head>
<body>

<!-- ===== 用户协议弹窗 ===== -->
<div id="agreementOverlay">
  <div class="agreement-box">
    <div class="agreement-title">📋 用户协议</div>

    <div class="agreement-body">
      <p>
        欢迎使用 <strong>韵殷 · 公益文件分享</strong>。在使用本网站前，请您仔细阅读以下协议内容。
      </p>
      <p>
        本网站为纯公益性质，所有资源均经过亲测，仅供学习交流使用。您在使用过程中产生的任何风险，由您自行承担。
      </p>
      <p>
        我们非常重视您的隐私保护。关于我们如何收集、使用和存储您的信息，请查看：
        <br>
        <span class="link" onclick="window.open('data/privacy.txt', '_blank')">📄 隐私协议</span>
        ・
        <span class="link" onclick="window.open('data/cookies.txt', '_blank')">🍪 Cookies 说明</span>
      </p>
      <hr class="agreement-divider">
      <p style="font-size:0.85rem; color:rgba(0,0,0,0.40);">
        继续使用即表示您已阅读并同意以上全部条款。
      </p>
    </div>

    <div class="agreement-footer">您需要确认同意才可使用本网站</div>

    <div class="agreement-actions">
      <button class="btn-disagree" id="disagreeBtn">不同意</button>
      <button class="btn-agree" id="agreeBtn">同意并进入</button>
    </div>
  </div>
</div>

<!-- ===== 主内容 ===== -->
<div class="card" role="main">
  <h1>🌸 安全入口</h1>
  <div class="subhead">韵殷 · 人机验证</div>

  <div class="captcha-section">
    <div class="captcha-sub">请拖动滑块完成人机验证</div>

    <div class="captcha-track" id="captchaTrack">
      <div class="captcha-bg" id="captchaBg"></div>
      <div class="captcha-thumb" id="captchaThumb">
        <svg viewBox="0 0 24 24">
          <path d="M5 12l4 4L19 6" />
        </svg>
      </div>
    </div>

    <div class="captcha-status" id="captchaStatus">拖动滑块到右侧</div>

    <div class="captcha-actions">
      <button type="button" class="btn-captcha-cancel" id="captchaResetBtn">重置</button>
      <button type="button" class="btn-captcha-confirm" id="captchaConfirmBtn" disabled>进入</button>
    </div>
  </div>

  <div id="messageBox" class="message-box"></div>
</div>

<script>
  (function() {
    "use strict";

    const REDIRECT_URL = "home.html";

    // ===== 用户协议状态 =====
    const AGREEMENT_KEY = 'yunyao_agreement_accepted';

    function isAgreementAccepted() {
      return localStorage.getItem(AGREEMENT_KEY) === 'true';
    }

    // ===== 验证状态管理 =====
    const VERIFY_KEY = 'yunyao_verified';
    const TIME_KEY = 'yunyao_verify_time';
    const EXPIRE_HOURS = 24;
    const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

    function isVerifiedValid() {
      const verified = localStorage.getItem(VERIFY_KEY) === 'true';
      const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
      const notExpired = (Date.now() - time) < EXPIRE_MS;
      return verified && notExpired;
    }

    // ===== 如果已登录且已同意协议，直接跳转 =====
    if (isVerifiedValid() && isAgreementAccepted()) {
      window.location.href = REDIRECT_URL;
      return;
    }

    // ===== 如果已同意协议但未验证，隐藏协议弹窗，显示验证 =====
    if (isAgreementAccepted()) {
      document.getElementById('agreementOverlay').classList.add('hidden');
    }

    // ===== 协议按钮事件 =====
    const agreeBtn = document.getElementById('agreeBtn');
    const disagreeBtn = document.getElementById('disagreeBtn');
    const agreementOverlay = document.getElementById('agreementOverlay');

    // ===== 同意协议 =====
    agreeBtn.addEventListener('click', function() {
      localStorage.setItem(AGREEMENT_KEY, 'true');
      agreementOverlay.classList.add('hidden');

      // 如果已验证，直接跳转
      if (isVerifiedValid()) {
        window.location.href = REDIRECT_URL;
      }
    });

    // ===== 不同意协议 =====
    disagreeBtn.addEventListener('click', function() {
      if (confirm('您需要同意用户协议才能使用本网站。\n\n点击"确定"重新阅读协议，点击"取消"离开网站。')) {
        // 重新显示协议，不做其他操作
        agreementOverlay.classList.remove('hidden');
      } else {
        // 用户选择离开
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1625;color:#eae6f2;font-family:sans-serif;padding:20px;text-align:center;">
            <div>
              <h2 style="font-weight:200;margin-bottom:1rem;">🙏 感谢您的访问</h2>
              <p style="color:rgba(255,255,255,0.5);font-weight:300;">您已选择不同意用户协议，将无法继续使用本网站。</p>
              <p style="color:rgba(255,255,255,0.3);font-weight:300;font-size:0.8rem;margin-top:1rem;">如果您改变了主意，请刷新页面重新选择。</p>
            </div>
          </div>
        `;
      }
    });

    // ============================================================
    // 滑块验证（原有逻辑）
    // ============================================================
    if (!isVerifiedValid() && localStorage.getItem(VERIFY_KEY) === 'true') {
      localStorage.removeItem(VERIFY_KEY);
      localStorage.removeItem(TIME_KEY);
    }

    const captchaTrack = document.getElementById('captchaTrack');
    const captchaBg = document.getElementById('captchaBg');
    const captchaThumb = document.getElementById('captchaThumb');
    const captchaStatus = document.getElementById('captchaStatus');
    const captchaConfirmBtn = document.getElementById('captchaConfirmBtn');
    const captchaResetBtn = document.getElementById('captchaResetBtn');
    const messageBox = document.getElementById('messageBox');

    let captchaResolved = false;
    let isDragging = false;
    let currentX = 0;
    const TRACK_PADDING = 6;
    const thumbWidth = 44;

    function setMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = 'message-box ' + type;
    }

    function resetCaptcha() {
      captchaResolved = false;
      captchaBg.style.width = '0%';
      captchaThumb.style.left = '0px';
      captchaStatus.textContent = '拖动滑块到右侧';
      captchaStatus.className = 'captcha-status';
      captchaConfirmBtn.disabled = true;
      currentX = 0;
    }

    function initCaptcha() {
      resetCaptcha();
    }

    function onStart(e) {
      e.preventDefault();
      if (captchaResolved) return;
      isDragging = true;
      captchaTrack.style.cursor = 'grabbing';
    }

    function onMove(e) {
      e.preventDefault();
      if (!isDragging || captchaResolved) return;
      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const rect = captchaTrack.getBoundingClientRect();
      let x = clientX - rect.left - thumbWidth / 2;
      const maxX = rect.width - thumbWidth - TRACK_PADDING;
      x = Math.max(TRACK_PADDING, Math.min(x, maxX));
      const percent = (x - TRACK_PADDING) / (maxX - TRACK_PADDING) * 100;
      captchaBg.style.width = percent + '%';
      captchaThumb.style.left = x + 'px';
      currentX = x;
    }

    function onEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      captchaTrack.style.cursor = 'grab';
      const rect = captchaTrack.getBoundingClientRect();
      const maxX = rect.width - thumbWidth - TRACK_PADDING;
      const threshold = maxX * 0.92;
      if (currentX >= threshold) {
        captchaResolved = true;
        captchaBg.style.width = '100%';
        captchaThumb.style.left = (maxX) + 'px';
        captchaStatus.textContent = '✓ 验证通过';
        captchaStatus.className = 'captcha-status success';
        captchaConfirmBtn.disabled = false;
      } else {
        if (currentX > TRACK_PADDING + 10) {
          captchaStatus.textContent = '请将滑块拖到最右侧';
          captchaStatus.className = 'captcha-status error';
          setTimeout(resetCaptcha, 600);
        } else {
          resetCaptcha();
        }
        captchaBg.style.width = '0%';
        captchaThumb.style.left = '0px';
        currentX = 0;
      }
    }

    captchaTrack.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);

    captchaTrack.addEventListener('touchstart', onStart, { passive: false });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd, { passive: false });

    window.addEventListener('resize', initCaptcha);

    captchaResetBtn.addEventListener('click', resetCaptcha);

    function doVerify() {
      if (!captchaResolved) return;

      // 检查是否已同意协议
      if (!isAgreementAccepted()) {
        agreementOverlay.classList.remove('hidden');
        return;
      }

      try {
        localStorage.setItem(VERIFY_KEY, 'true');
        localStorage.setItem(TIME_KEY, Date.now().toString());
        if (localStorage.getItem(VERIFY_KEY) !== 'true') {
          throw new Error('写入失败');
        }
      } catch (e) {
        setMessage('存储失败，请重试', 'error');
        return;
      }
      setMessage('验证成功，正在进入...', 'success');
      setTimeout(function() {
        window.location.href = REDIRECT_URL;
      }, 600);
    }

    captchaConfirmBtn.addEventListener('click', doVerify);

    initCaptcha();
  })();
</script>

</body>
</html>
