<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 文件分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("https://haowallpaper.com/link/common/file/previewFileImg/16722363990330752") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            padding: 30px 0;
            min-height: 100vh;
        }

        #mainContent {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .glass-block {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 48px;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            transition: all 0.4s ease;
        }

        .glass-block:hover {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            color: #000000;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.18);
            color: #000000;
            transform: translateX(-3px);
        }

        .section-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            padding-left: 0.8rem;
            border-left: 2px solid rgba(255, 255, 255, 0.20);
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.02);
        }

        .search-wrapper {
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            flex: 1;
            min-width: 200px;
            position: relative;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
        }

        .search-icon {
            color: #000000;
            padding: 0 12px 0 16px;
            font-size: 15px;
        }

        .search-box input {
            color: #000000;
            background: transparent;
            border: none;
            flex: 1;
            padding: 10px 10px 10px 0;
            font-size: 15px;
            font-weight: 300;
            outline: none;
            min-width: 80px;
        }

        .search-box input::placeholder {
            color: rgba(0, 0, 0, 0.30);
            font-weight: 200;
        }

        .search-clear {
            background: none;
            border: none;
            color: #000000;
            cursor: pointer;
            font-size: 16px;
            padding: 0 14px;
            transition: color 0.2s;
            display: none;
        }

        .search-clear:hover {
            color: #000000;
        }

        .search-box input:not(:placeholder-shown) ~ .search-clear {
            display: block;
        }

        .search-hint {
            color: #000000;
            font-size: 12px;
            font-weight: 200;
            white-space: nowrap;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 120px;
        }

        /* ===== 骨架屏 ===== */
        .skeleton-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: skeletonPulse 1.2s ease-in-out infinite;
        }

        .skeleton-item .skeleton-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .skeleton-item .skeleton-icon {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .skeleton-item .skeleton-name {
            height: 16px;
            width: 55%;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .skeleton-item .skeleton-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .skeleton-item .skeleton-size {
            height: 14px;
            width: 50px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
        }

        .skeleton-item .skeleton-date {
            height: 14px;
            width: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        @keyframes skeletonPulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        /* ===== 列表项进入动画 ===== */
        .file-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            transition: all 0.3s ease;
            text-decoration: none;
            opacity: 0;
            transform: translateY(10px);
            animation: itemFadeIn 0.3s ease forwards;
        }

        .file-item:nth-child(1) { animation-delay: 0.02s; }
        .file-item:nth-child(2) { animation-delay: 0.04s; }
        .file-item:nth-child(3) { animation-delay: 0.06s; }
        .file-item:nth-child(4) { animation-delay: 0.08s; }
        .file-item:nth-child(5) { animation-delay: 0.10s; }
        .file-item:nth-child(6) { animation-delay: 0.12s; }
        .file-item:nth-child(7) { animation-delay: 0.14s; }
        .file-item:nth-child(8) { animation-delay: 0.16s; }
        .file-item:nth-child(9) { animation-delay: 0.18s; }
        .file-item:nth-child(10) { animation-delay: 0.20s; }
        .file-item:nth-child(11) { animation-delay: 0.22s; }
        .file-item:nth-child(12) { animation-delay: 0.24s; }
        .file-item:nth-child(13) { animation-delay: 0.26s; }
        .file-item:nth-child(14) { animation-delay: 0.28s; }
        .file-item:nth-child(15) { animation-delay: 0.30s; }
        .file-item:nth-child(16) { animation-delay: 0.32s; }
        .file-item:nth-child(17) { animation-delay: 0.34s; }
        .file-item:nth-child(18) { animation-delay: 0.36s; }
        .file-item:nth-child(19) { animation-delay: 0.38s; }
        .file-item:nth-child(20) { animation-delay: 0.40s; }

        @keyframes itemFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.14);
            color: #000000;
            transform: translateX(4px);
        }

        .file-name {
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
            letter-spacing: 0.3px;
        }

        .file-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
        }

        .file-size {
            color: #000000;
            font-size: 12px;
            font-weight: 200;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 12px;
        }

        .file-date {
            color: #000000;
            font-size: 12px;
            font-weight: 200;
        }

        .highlight {
            background: rgba(0, 0, 0, 0.08);
            color: #000000;
            padding: 0 4px;
            border-radius: 3px;
            font-weight: 400;
        }

        .empty {
            color: #000000;
            font-weight: 200;
            text-align: center;
            padding: 40px 20px;
            opacity: 0;
            animation: itemFadeIn 0.3s ease 0.1s forwards;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
            opacity: 0;
            animation: itemFadeIn 0.3s ease 0.2s forwards;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: #000000;
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.25s;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.14);
            color: #000000;
        }

        .page-btn.active {
            background: rgba(255, 255, 255, 0.14);
            color: #000000;
            border-color: rgba(255, 255, 255, 0.18);
        }

        .page-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .page-dots {
            color: #000000;
            padding: 0 4px;
        }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 1rem;
            opacity: 0;
            animation: itemFadeIn 0.3s ease 0.3s forwards;
        }

        /* ===== 弹窗样式 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border-radius: 40px;
            padding: 2.2rem 2rem;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(255, 255, 255, 0.10);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.5rem;
            font-weight: 200;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 1rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        }

        .modal-title .icon {
            margin-right: 8px;
        }

        .modal-body {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.9;
            text-align: left;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 1rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal-body p {
            margin-bottom: 0.7rem;
        }

        .modal-body p:last-child {
            margin-bottom: 0;
        }

        .modal-body .highlight {
            color: #ff8a50;
            font-weight: 400;
        }

        .modal-body .highlight-red {
            color: #cc2233;
            font-weight: 400;
        }

        .modal-body .section-title {
            font-weight: 500;
            font-size: 0.95rem;
            margin-top: 0.3rem;
            margin-bottom: 0.3rem;
            color: #000000;
            border-left: 3px solid rgba(255, 255, 255, 0.30);
            padding-left: 0.7rem;
        }

        .modal-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin: 0.6rem 0;
        }

        .modal-close-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.12);
            color: #000000;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.02);
        }

        .modal-overlay.hidden {
            display: none;
        }

        /* ===== 倒计时遮罩 ===== */
        #expireOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 20px;
            flex-direction: column;
        }

        #expireOverlay.show {
            display: flex;
        }

        .expire-box {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 0 rgba(255, 255, 255, 0.10);
            text-align: center;
            animation: slideUp 0.4s ease;
        }

        .expire-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .expire-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .expire-body {
            color: rgba(255, 255, 255, 0.60);
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .expire-countdown {
            font-size: 3rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.90);
            margin-bottom: 1.2rem;
            letter-spacing: 2px;
        }

        .expire-btn {
            display: inline-block;
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            text-decoration: none;
        }

        .expire-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
        }

        @media (max-width: 640px) {
            .glass-block { padding: 1.2rem; }
            .section-title { font-size: 1.3rem; }
            .file-item { flex-wrap: wrap; gap: 6px; }
            .file-meta { flex-wrap: wrap; gap: 6px; }
            .search-wrapper { flex-direction: column; align-items: stretch; }
            .search-hint { text-align: center; font-size: 11px; }
            .back-bar { gap: 0.5rem; }
            #mainContent { padding: 0 12px; }
            .modal-box { padding: 1.5rem 1.2rem; }
            .modal-title { font-size: 1.3rem; }
            .modal-body { font-size: 0.8rem; padding: 0.8rem 1rem; }
            .expire-box { padding: 2rem 1.5rem; }
            .expire-countdown { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<!-- ===== 验证过期遮罩 ===== -->
<div id="expireOverlay">
    <div class="expire-box">
        <div class="expire-icon">⏳</div>
        <div class="expire-title">验证已过期</div>
        <div class="expire-body">请重新验证后继续使用</div>
        <div class="expire-countdown" id="countdownDisplay">5</div>
        <a href="index.html" class="expire-btn" id="expireRedirectBtn">直接验证</a>
    </div>
</div>

<!-- ===== 安全提示弹窗 ===== -->
<div id="securityModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title"><span class="icon">🛡️</span> 下载安全提示</div>
        <div class="modal-body">
            <p>
                韵殷团队已对所有文件进行 <span class="highlight">亲测扫描</span>，<br>
                确认无病毒、无恶意行为，请您放心下载。
            </p>
            <hr class="modal-divider">
            <div class="section-title">⚠️ 请注意</div>
            <p>
                • 部分文件来源于第三方下载站，链接由网友提供<br>
                • 团队虽已自测，但 <span class="highlight-red">无法保证第三方后续是否篡改文件</span><br>
                • 下载后请自行使用杀毒软件扫描，<span class="highlight-red">风险由用户自行承担</span>
            </p>
            <hr class="modal-divider">
            <p style="font-size:0.85rem; color:rgba(0,0,0,0.50);">
                📬 如发现文件异常，请立即通过 QQ群 / 频道 / 邮箱 反馈，<br>
                我们会第一时间核实处理。
            </p>
        </div>
        <button class="modal-close-btn" id="closeSecurityModalBtn">我知道了</button>
    </div>
</div>

<!-- ===== 主内容 ===== -->
<div id="mainContent">
    <div class="glass-block">
        <div class="back-bar">
            <a href="home.html" class="back-btn">← 返回菜单</a>
            <span style="color:#000000; font-size:0.9rem;">📂 文件分享</span>
            <span style="margin-left:auto; font-size:0.7rem; color:#000000;" id="fileCount">加载中...</span>
        </div>

        <div class="search-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索文件名..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn">✕</button>
            </div>
            <span class="search-hint" id="searchHint">共 <span id="totalCount">0</span> 个文件</span>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="pagination" id="pagination"></div>

        <div class="footer">所有链接均为永久有效 · 公益分享</div>
    </div>
</div>

<script>
    (function() {
        // ============================================================
        // 1. 验证检查 + 过期倒计时遮罩
        // ============================================================
        const VERIFY_KEY = 'yunyao_verified';
        const TIME_KEY = 'yunyao_verify_time';
        const EXPIRE_HOURS = 24;
        const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

        function isVerifiedValid() {
            const verified = localStorage.getItem(VERIFY_KEY) === 'true';
            const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
            const notExpired = (Date.now() - time) < EXPIRE_MS;
            return verified && notExpired;
        }

        if (!isVerifiedValid()) {
            if (localStorage.getItem(VERIFY_KEY) === 'true') {
                localStorage.removeItem(VERIFY_KEY);
                localStorage.removeItem(TIME_KEY);
            }

            const overlay = document.getElementById('expireOverlay');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const redirectBtn = document.getElementById('expireRedirectBtn');
            let countdown = 5;

            overlay.classList.add('show');

            const timer = setInterval(function() {
                countdown -= 1;
                countdownDisplay.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(timer);
                    window.location.href = 'index.html';
                }
            }, 1000);

            redirectBtn.addEventListener('click', function(e) {
                e.preventDefault();
                clearInterval(timer);
                window.location.href = 'index.html';
            });

            document.body.style.overflow = 'hidden';
            return;
        }

        document.getElementById('mainContent').style.display = 'block';
        document.body.style.overflow = '';

        // ============================================================
        // 2. 安全提示弹窗（每 2 小时显示一次）
        // ============================================================
        const securityModal = document.getElementById('securityModal');
        const closeSecurityBtn = document.getElementById('closeSecurityModalBtn');

        const SECURITY_KEY = 'yunyao_security_time';
        const SECURITY_INTERVAL = 2 * 60 * 60 * 1000;

        const lastSecurityTime = parseInt(localStorage.getItem(SECURITY_KEY) || '0');
        const now = Date.now();

        if (lastSecurityTime === 0 || (now - lastSecurityTime) > SECURITY_INTERVAL) {
            securityModal.classList.remove('hidden');
        } else {
            securityModal.classList.add('hidden');
        }

        closeSecurityBtn.addEventListener('click', function() {
            securityModal.classList.add('hidden');
            localStorage.setItem(SECURITY_KEY, Date.now().toString());
        });

        securityModal.addEventListener('click', function(e) {
            if (e.target === securityModal) {
                securityModal.classList.add('hidden');
                localStorage.setItem(SECURITY_KEY, Date.now().toString());
            }
        });
    })();

    // ============================================================
    // 3. 文件列表功能（含骨架屏）
    // ============================================================
    const PER_PAGE = 20;
    let allFiles = [];
    let filteredFiles = [];
    let currentPage = 1;
    let searchKeyword = '';

    const fileList = document.getElementById('fileList');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const totalCountSpan = document.getElementById('totalCount');
    const fileCountSpan = document.getElementById('fileCount');

    // ===== 渲染骨架屏 =====
    function renderSkeleton(count) {
        let html = '';
        for (let i = 0; i < count; i++) {
            html += `
                <div class="skeleton-item">
                    <div class="skeleton-left">
                        <div class="skeleton-icon"></div>
                        <div class="skeleton-name"></div>
                    </div>
                    <div class="skeleton-right">
                        <div class="skeleton-size"></div>
                        <div class="skeleton-date"></div>
                    </div>
                </div>
            `;
        }
        fileList.innerHTML = html;
    }

    renderSkeleton(10);

    async function loadFiles() {
        try {
            const response = await fetch('data/files.json?t=' + Date.now());
            if (!response.ok) {
                throw new Error('JSON 文件不存在');
            }
            allFiles = await response.json();
        } catch (e) {
            allFiles = [];
            fileList.innerHTML = `
                <div class="empty">
                    ⚠️ 数据文件加载失败，请确保 data/files.json 存在
                    <br><span style="font-size:0.8rem;color:#000000;">${e.message}</span>
                </div>
            `;
            return;
        }

        allFiles.sort((a, b) => new Date(b.date) - new Date(a.date));
        filteredFiles = allFiles;
        updateStats();
        renderPage(1);
    }

    function handleSearch() {
        const keyword = searchInput.value.trim().toLowerCase();
        searchKeyword = keyword;

        if (!keyword) {
            filteredFiles = allFiles;
        } else {
            filteredFiles = allFiles.filter(file =>
                file.name.toLowerCase().includes(keyword)
            );
        }

        currentPage = 1;
        updateStats();
        renderPage(1);
    }

    function updateStats() {
        const total = filteredFiles.length;
        totalCountSpan.textContent = total;
        fileCountSpan.textContent = `共 ${total} 个文件${searchKeyword ? ' · 已筛选' : ''}`;
        clearSearchBtn.style.display = searchInput.value.trim() ? 'block' : 'none';
    }

    function highlightText(text, keyword) {
        if (!keyword) return text;
        const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    function renderPage(page) {
        const total = filteredFiles.length;
        const totalPages = Math.ceil(total / PER_PAGE) || 1;

        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        currentPage = page;

        const start = (page - 1) * PER_PAGE;
        const end = Math.min(start + PER_PAGE, total);
        const pageData = filteredFiles.slice(start, end);

        if (pageData.length === 0) {
            fileList.innerHTML = `
                <div class="empty">
                    ${searchKeyword ? `🔍 没有找到包含 "${searchKeyword}" 的文件` : '📭 暂无文件'}
                </div>
            `;
        } else {
            fileList.innerHTML = pageData.map(file => `
                <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="file-item">
                    <span class="file-name">📄 ${highlightText(file.name, searchKeyword)}</span>
                    <span class="file-meta">
                        <span class="file-size">${file.size || '未知大小'}</span>
                        <span class="file-date">${file.date || ''}</span>
                    </span>
                </a>
            `).join('');
        }

        renderPagination(total, totalPages);
    }

    function renderPagination(total, totalPages) {
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = `
            <button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
        `;

        let startPage = Math.max(1, currentPage - 3);
        let endPage = Math.min(totalPages, currentPage + 3);

        if (startPage > 1) {
            html += `<button class="page-btn" data-page="1">1</button>`;
            if (startPage > 2) html += `<span class="page-dots">…</span>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<span class="page-dots">…</span>`;
            html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
        }

        html += `
            <button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
        `;

        pagination.innerHTML = html;

        pagination.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.disabled) return;
                const page = this.dataset.page;
                if (page === 'prev') {
                    if (currentPage > 1) goToPage(currentPage - 1);
                } else if (page === 'next') {
                    if (currentPage < totalPages) goToPage(currentPage + 1);
                } else {
                    goToPage(parseInt(page));
                }
            });
        });
    }

    function goToPage(page) {
        currentPage = page;
        renderPage(page);
        fileList.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(handleSearch, 300);
    });

    clearSearchBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchInput.focus();
        handleSearch();
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            searchInput.value = '';
            handleSearch();
            searchInput.blur();
        }
    });

    loadFiles();
</script>

</body>
</html>
