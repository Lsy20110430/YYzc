<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 文件分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #e8e6ed url("https://picui.ogmua.cn/s1/2026/07/31/6a6c81f424ff0.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            padding: 30px 0;
            min-height: 100vh;
        }

        #mainContent {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== 大框：高透明度玻璃感 ===== */
        .glass-block {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: saturate(150%);
            -webkit-backdrop-filter: saturate(150%);
            border-radius: 48px;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 40px 80px -30px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            transition: all 0.4s ease;
        }

        .glass-block:hover {
            background: rgba(255, 255, 255, 0.32);
            border-color: rgba(255, 255, 255, 0.40);
            box-shadow: 
                0 50px 100px -30px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1.0),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            color: #000000;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.18);
            color: #000000;
            transform: translateX(-3px);
        }

        .section-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            padding-left: 0.8rem;
            border-left: 2px solid rgba(255, 255, 255, 0.20);
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.02);
        }

        .search-wrapper {
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 40px;
            flex: 1;
            min-width: 200px;
            position: relative;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
        }

        .search-icon {
            color: #000000;
            padding: 0 12px 0 16px;
            font-size: 15px;
        }

        .search-box input {
            color: #000000;
            background: transparent;
            border: none;
            flex: 1;
            padding: 10px 10px 10px 0;
            font-size: 15px;
            font-weight: 300;
            outline: none;
            min-width: 80px;
        }

        .search-box input::placeholder {
            color: rgba(0, 0, 0, 0.30);
            font-weight: 200;
        }

        .search-clear {
            background: none;
            border: none;
            color: #000000;
            cursor: pointer;
            font-size: 16px;
            padding: 0 14px;
            transition: color 0.2s;
            display: none;
        }

        .search-clear:hover {
            color: #000000;
        }

        .search-box input:not(:placeholder-shown) ~ .search-clear {
            display: block;
        }

        .search-hint {
            color: #000000;
            font-size: 12px;
            font-weight: 200;
            white-space: nowrap;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.14);
            color: #000000;
            transform: translateX(4px);
        }

        .file-name {
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
            letter-spacing: 0.3px;
        }

        .file-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
        }

        .file-size {
            color: #000000;
            font-size: 12px;
            font-weight: 200;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 12px;
        }

        .file-date {
            color: #000000;
            font-size: 12px;
            font-weight: 200;
        }

        .highlight {
            background: rgba(0, 0, 0, 0.08);
            color: #000000;
            padding: 0 4px;
            border-radius: 3px;
            font-weight: 400;
        }

        .empty {
            color: #000000;
            font-weight: 200;
            text-align: center;
            padding: 40px 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: #000000;
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.25s;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.14);
            color: #000000;
        }

        .page-btn.active {
            background: rgba(255, 255, 255, 0.14);
            color: #000000;
            border-color: rgba(255, 255, 255, 0.18);
        }

        .page-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .page-dots {
            color: #000000;
            padding: 0 4px;
        }

        .footer {
            color: #000000;
            font-size: 0.6rem;
            font-weight: 200;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .glass-block { padding: 1.2rem; }
            .section-title { font-size: 1.3rem; }
            .file-item { flex-wrap: wrap; gap: 6px; }
            .file-meta { flex-wrap: wrap; gap: 6px; }
            .search-wrapper { flex-direction: column; align-items: stretch; }
            .search-hint { text-align: center; font-size: 11px; }
            .back-bar { gap: 0.5rem; }
            #mainContent { padding: 0 12px; }
        }
    </style>
</head>
<body>

<div id="mainContent">
    <div class="glass-block">
        <div class="back-bar">
            <a href="home.html" class="back-btn">← 返回菜单</a>
            <span style="color:#000000; font-size:0.9rem;">📂 文件分享</span>
            <span style="margin-left:auto; font-size:0.7rem; color:#000000;" id="fileCount">加载中...</span>
        </div>

        <div class="search-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索文件名..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn">✕</button>
            </div>
            <span class="search-hint" id="searchHint">共 <span id="totalCount">0</span> 个文件</span>
        </div>

        <div class="file-list" id="fileList">
            <div class="empty">⏳ 加载中...</div>
        </div>

        <div class="pagination" id="pagination"></div>

        <div class="footer">所有链接均为永久有效 · 公益分享</div>
    </div>
</div>

<script>
    (function() {
        const VERIFY_KEY = 'yunyao_verified';
        const TIME_KEY = 'yunyao_verify_time';
        const EXPIRE_HOURS = 24;
        const EXPIRE_MS = EXPIRE_HOURS * 60 * 60 * 1000;

        function isVerifiedValid() {
            const verified = localStorage.getItem(VERIFY_KEY) === 'true';
            const time = parseInt(localStorage.getItem(TIME_KEY) || '0');
            const notExpired = (Date.now() - time) < EXPIRE_MS;
            return verified && notExpired;
        }

        if (!isVerifiedValid()) {
            if (localStorage.getItem(VERIFY_KEY) === 'true') {
                localStorage.removeItem(VERIFY_KEY);
                localStorage.removeItem(TIME_KEY);
            }
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('mainContent').style.display = 'block';
    })();

    const PER_PAGE = 20;
    let allFiles = [];
    let filteredFiles = [];
    let currentPage = 1;
    let searchKeyword = '';

    const fileList = document.getElementById('fileList');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const totalCountSpan = document.getElementById('totalCount');
    const fileCountSpan = document.getElementById('fileCount');

    async function loadFiles() {
        try {
            const response = await fetch('data/files.json?t=' + Date.now());
            if (!response.ok) {
                throw new Error('JSON 文件不存在');
            }
            allFiles = await response.json();
        } catch (e) {
            allFiles = [];
            fileList.innerHTML = `
                <div class="empty">
                    ⚠️ 数据文件加载失败，请确保 data/files.json 存在
                    <br><span style="font-size:0.8rem;color:#000000;">${e.message}</span>
                </div>
            `;
            return;
        }

        allFiles.sort((a, b) => new Date(b.date) - new Date(a.date));
        filteredFiles = allFiles;
        updateStats();
        renderPage(1);
    }

    function handleSearch() {
        const keyword = searchInput.value.trim().toLowerCase();
        searchKeyword = keyword;

        if (!keyword) {
            filteredFiles = allFiles;
        } else {
            filteredFiles = allFiles.filter(file =>
                file.name.toLowerCase().includes(keyword)
            );
        }

        currentPage = 1;
        updateStats();
        renderPage(1);
    }

    function updateStats() {
        const total = filteredFiles.length;
        totalCountSpan.textContent = total;
        fileCountSpan.textContent = `共 ${total} 个文件${searchKeyword ? ' · 已筛选' : ''}`;
        clearSearchBtn.style.display = searchInput.value.trim() ? 'block' : 'none';
    }

    function highlightText(text, keyword) {
        if (!keyword) return text;
        const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    function renderPage(page) {
        const total = filteredFiles.length;
        const totalPages = Math.ceil(total / PER_PAGE) || 1;

        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        currentPage = page;

        const start = (page - 1) * PER_PAGE;
        const end = Math.min(start + PER_PAGE, total);
        const pageData = filteredFiles.slice(start, end);

        if (pageData.length === 0) {
            fileList.innerHTML = `
                <div class="empty">
                    ${searchKeyword ? `🔍 没有找到包含 "${searchKeyword}" 的文件` : '📭 暂无文件'}
                </div>
            `;
        } else {
            fileList.innerHTML = pageData.map(file => `
                <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="file-item">
                    <span class="file-name">📄 ${highlightText(file.name, searchKeyword)}</span>
                    <span class="file-meta">
                        <span class="file-size">${file.size || '未知大小'}</span>
                        <span class="file-date">${file.date || ''}</span>
                    </span>
                </a>
            `).join('');
        }

        renderPagination(total, totalPages);
    }

    function renderPagination(total, totalPages) {
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = `
            <button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
        `;

        let startPage = Math.max(1, currentPage - 3);
        let endPage = Math.min(totalPages, currentPage + 3);

        if (startPage > 1) {
            html += `<button class="page-btn" data-page="1">1</button>`;
            if (startPage > 2) html += `<span class="page-dots">…</span>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<span class="page-dots">…</span>`;
            html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
        }

        html += `
            <button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
        `;

        pagination.innerHTML = html;

        pagination.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.disabled) return;
                const page = this.dataset.page;
                if (page === 'prev') {
                    if (currentPage > 1) goToPage(currentPage - 1);
                } else if (page === 'next') {
                    if (currentPage < totalPages) goToPage(currentPage + 1);
                } else {
                    goToPage(parseInt(page));
                }
            });
        });
    }

    function goToPage(page) {
        currentPage = page;
        renderPage(page);
        fileList.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(handleSearch, 300);
    });

    clearSearchBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchInput.focus();
        handleSearch();
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            searchInput.value = '';
            handleSearch();
            searchInput.blur();
        }
    });

    loadFiles();
</script>

</body>
</html>
