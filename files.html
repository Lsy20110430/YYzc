<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>韵殷 · 文件分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { font-size: 14px; }
        @media (max-width: 375px) { html { font-size: 12px; } }
        @media (min-width: 768px) { html { font-size: 16px; } }

        body {
            background: #1a1625 url("https://pic1.imgdb.cn/item/69622b91bec004ac7e59a4da.png") no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "Heiti SC", "Segoe UI", system-ui, sans-serif;
            color: #eae6f2;
            padding: 30px 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .glass-block {
            background: rgba(30, 26, 42, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 2rem 1.8rem;
            border: 2px solid rgba(250, 204, 212, 0.45);
            box-shadow: 0 12px 28px rgba(255, 138, 174, 0.15);
            transition: all 0.2s ease;
        }

        .glass-block:hover {
            border-color: rgba(255, 138, 174, 0.7);
            box-shadow: 0 16px 32px rgba(255, 138, 174, 0.25);
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(255, 138, 174, 0.2);
            border: 2px solid rgba(255, 138, 174, 0.5);
            border-radius: 40px;
            color: #ff8aae;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 138, 174, 0.35);
            transform: translateX(-3px);
        }

        .section-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ff8aae;
            margin-bottom: 1.2rem;
            padding-left: 0.8rem;
            border-left: 5px solid #ff8aae;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* 搜索框 */
        .search-wrapper {
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.10);
            border: 2px solid rgba(255,200,210,0.4);
            border-radius: 40px;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: #ff8aae;
            background: rgba(30,20,45,0.6);
            box-shadow: 0 0 0 3px rgba(255, 138, 174, 0.15);
        }

        .search-icon {
            padding: 0 12px 0 16px;
            color: #a89bb8;
            font-size: 16px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 10px 10px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: #eae6f2;
            min-width: 80px;
        }

        .search-box input::placeholder {
            color: #8a7e9e;
        }

        .search-clear {
            padding: 0 14px;
            background: none;
            border: none;
            color: #a89bb8;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
            display: none;
        }

        .search-clear:hover {
            color: #ff6b6b;
        }

        .search-box input:not(:placeholder-shown) ~ .search-clear {
            display: block;
        }

        .search-hint {
            font-size: 13px;
            color: #8a7e9e;
            white-space: nowrap;
        }

        /* 文件列表 */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: all 0.2s;
            text-decoration: none;
            color: #eae6f2;
            border: 1px solid rgba(255,200,210,0.15);
        }

        .file-item:hover {
            background: rgba(255,255,255,0.10);
            border-color: rgba(255,138,174,0.4);
            transform: translateX(4px);
        }

        .file-name {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }

        .file-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
        }

        .file-size {
            color: #a89bb8;
            font-size: 13px;
            background: rgba(255,255,255,0.06);
            padding: 2px 12px;
            border-radius: 12px;
        }

        .file-date {
            color: #8a7e9e;
            font-size: 13px;
        }

        .highlight {
            background: #fefcbf;
            color: #1a1625;
            padding: 0 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #8a7e9e;
        }

        /* 分页器 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,200,210,0.2);
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,200,210,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: #eae6f2;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(255,138,174,0.2);
            border-color: #ff8aae;
        }

        .page-btn.active {
            background: #ff8aae;
            color: #1a1625;
            border-color: #ff8aae;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-dots {
            padding: 0 4px;
            color: #8a7e9e;
        }

        .stats {
            background: rgba(255,138,174,0.10);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #cdc2e6;
            border: 1px solid rgba(255,138,174,0.15);
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 1rem;
            color: #8a7e9e;
        }

        @media (max-width: 640px) {
            .glass-block { padding: 1.2rem; }
            .section-title { font-size: 1.3rem; }
            .file-item { flex-wrap: wrap; gap: 6px; }
            .file-meta { flex-wrap: wrap; gap: 6px; }
            .search-wrapper { flex-direction: column; align-items: stretch; }
            .search-hint { text-align: center; font-size: 12px; }
            .back-bar { gap: 0.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-block">
        <div class="back-bar">
            <a href="index.html" class="back-btn">← 返回菜单</a>
            <span style="color:#cdc2e6; font-size:0.9rem;">📂 文件分享</span>
            <span style="margin-left:auto; font-size:0.7rem; color:#8a7e9e;" id="fileCount">加载中...</span>
        </div>

        <!-- 搜索框 -->
        <div class="search-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索文件名..." autocomplete="off">
                <button class="search-clear" id="clearSearchBtn">✕</button>
            </div>
            <span class="search-hint" id="searchHint">共 <span id="totalCount">0</span> 个文件</span>
        </div>

        <!-- 文件列表 -->
        <div class="file-list" id="fileList">
            <div class="empty">⏳ 加载中...</div>
        </div>

        <!-- 分页器 -->
        <div class="pagination" id="pagination"></div>

        <div class="footer">所有链接均为永久有效 · 公益分享</div>
    </div>
</div>

<script>
    // ===== 配置 =====
    const PER_PAGE = 20;
    let allFiles = [];
    let filteredFiles = [];
    let currentPage = 1;
    let searchKeyword = '';

    // ===== DOM 引用 =====
    const fileList = document.getElementById('fileList');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const totalCountSpan = document.getElementById('totalCount');
    const fileCountSpan = document.getElementById('fileCount');

    // ===== 加载数据 =====
    async function loadFiles() {
        try {
            // 尝试加载数据，如果文件不存在则使用示例数据
            let response = await fetch('data/files.json?t=' + Date.now());
            if (!response.ok) {
                // 如果文件不存在，使用内嵌示例数据
                throw new Error('使用示例数据');
            }
            allFiles = await response.json();
        } catch (e) {
            // 示例数据（方便演示）
            allFiles = [
                { name: '韵殷功能包.zip', url: 'https://wwbkl.lanzouu.com/i4VOK3fsdo7g', size: '15 MB', date: '2026-07-20' },
                { name: '韵殷养成游戏.apk', url: 'https://wwbkl.lanzouu.com/iou0X3fsegmj', size: '8 MB', date: '2026-07-19' },
                { name: '韵殷授权文档.pdf', url: 'https://wwbkl.lanzouu.com/iMuQB3fseysd', size: '2 MB', date: '2026-07-18' },
                { name: '和平科技包.zip', url: 'https://wwbkl.lanzouu.com/id9fc3hfj5te', size: '45 MB', date: '2026-07-17' },
                { name: '系统优化工具.exe', url: 'https://example.com/file1', size: '3 MB', date: '2026-07-16' },
                { name: '学习资料合集.pdf', url: 'https://example.com/file2', size: '12 MB', date: '2026-07-15' },
                { name: '影视剪辑模板.zip', url: 'https://example.com/file3', size: '120 MB', date: '2026-07-14' },
                { name: '开源项目源码.rar', url: 'https://example.com/file4', size: '6 MB', date: '2026-07-13' },
                { name: '音乐精选集.flac', url: 'https://example.com/file5', size: '280 MB', date: '2026-07-12' },
                { name: '电子书合集.epub', url: 'https://example.com/file6', size: '4 MB', date: '2026-07-11' },
                { name: '游戏补丁v2.0.exe', url: 'https://example.com/file7', size: '18 MB', date: '2026-07-10' },
                { name: '设计素材包.psd', url: 'https://example.com/file8', size: '95 MB', date: '2026-07-09' },
                { name: '驱动程序安装包.exe', url: 'https://example.com/file9', size: '22 MB', date: '2026-07-08' },
                { name: '论文模板.docx', url: 'https://example.com/file10', size: '1.5 MB', date: '2026-07-07' },
                { name: '动画短片.mp4', url: 'https://example.com/file11', size: '65 MB', date: '2026-07-06' },
                { name: '数据统计表格.xlsx', url: 'https://example.com/file12', size: '0.8 MB', date: '2026-07-05' },
                { name: '字体包合集.ttf', url: 'https://example.com/file13', size: '32 MB', date: '2026-07-04' },
                { name: '虚拟机镜像.ova', url: 'https://example.com/file14', size: '520 MB', date: '2026-07-03' },
                { name: 'API文档.html', url: 'https://example.com/file15', size: '0.3 MB', date: '2026-07-02' },
                { name: '壁纸合集.zip', url: 'https://example.com/file16', size: '28 MB', date: '2026-07-01' },
                { name: '代码片段库.json', url: 'https://example.com/file17', size: '0.1 MB', date: '2026-06-30' },
                { name: '教程视频.mp4', url: 'https://example.com/file18', size: '180 MB', date: '2026-06-29' },
            ];
        }

        // 按日期倒序排序
        allFiles.sort((a, b) => new Date(b.date) - new Date(a.date));
        filteredFiles = allFiles;
        updateStats();
        renderPage(1);
    }

    // ===== 搜索处理 =====
    function handleSearch() {
        const keyword = searchInput.value.trim().toLowerCase();
        searchKeyword = keyword;

        if (!keyword) {
            filteredFiles = allFiles;
        } else {
            filteredFiles = allFiles.filter(file =>
                file.name.toLowerCase().includes(keyword)
            );
        }

        currentPage = 1;
        updateStats();
        renderPage(1);
    }

    // ===== 更新统计 =====
    function updateStats() {
        const total = filteredFiles.length;
        totalCountSpan.textContent = total;
        fileCountSpan.textContent = `共 ${total} 个文件${searchKeyword ? ' · 已筛选' : ''}`;

        // 显示/隐藏清空按钮
        clearSearchBtn.style.display = searchInput.value.trim() ? 'block' : 'none';
    }

    // ===== 高亮文本 =====
    function highlightText(text, keyword) {
        if (!keyword) return text;
        const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    // ===== 渲染页面 =====
    function renderPage(page) {
        const total = filteredFiles.length;
        const totalPages = Math.ceil(total / PER_PAGE) || 1;

        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        currentPage = page;

        const start = (page - 1) * PER_PAGE;
        const end = Math.min(start + PER_PAGE, total);
        const pageData = filteredFiles.slice(start, end);

        // 渲染列表
        if (pageData.length === 0) {
            fileList.innerHTML = `
                <div class="empty">
                    ${searchKeyword ? `🔍 没有找到包含 "${searchKeyword}" 的文件` : '📭 暂无文件'}
                </div>
            `;
        } else {
            fileList.innerHTML = pageData.map(file => `
                <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="file-item">
                    <span class="file-name">📄 ${highlightText(file.name, searchKeyword)}</span>
                    <span class="file-meta">
                        <span class="file-size">${file.size || '未知大小'}</span>
                        <span class="file-date">${file.date || ''}</span>
                    </span>
                </a>
            `).join('');
        }

        // 渲染分页器
        renderPagination(total, totalPages);
    }

    // ===== 渲染分页器 =====
    function renderPagination(total, totalPages) {
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = `
            <button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
        `;

        let startPage = Math.max(1, currentPage - 3);
        let endPage = Math.min(totalPages, currentPage + 3);

        if (startPage > 1) {
            html += `<button class="page-btn" data-page="1">1</button>`;
            if (startPage > 2) html += `<span class="page-dots">…</span>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<span class="page-dots">…</span>`;
            html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
        }

        html += `
            <button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
        `;

        pagination.innerHTML = html;

        // 绑定事件
        pagination.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.disabled) return;
                const page = this.dataset.page;
                if (page === 'prev') {
                    if (currentPage > 1) goToPage(currentPage - 1);
                } else if (page === 'next') {
                    if (currentPage < totalPages) goToPage(currentPage + 1);
                } else {
                    goToPage(parseInt(page));
                }
            });
        });
    }

    function goToPage(page) {
        currentPage = page;
        renderPage(page);
        fileList.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ===== 事件绑定 =====
    // 搜索输入（防抖）
    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(handleSearch, 300);
    });

    // 清空搜索
    clearSearchBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchInput.focus();
        handleSearch();
    });

    // 键盘快捷键：ESC 清空搜索
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            searchInput.value = '';
            handleSearch();
            searchInput.blur();
        }
    });

    // ===== 启动 =====
    loadFiles();
</script>

</body>
</html>
